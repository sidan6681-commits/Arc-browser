  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --arc-grad: linear-gradient(135deg, #b9a8d9 0%, #ffcfdc 45%, #d6dffa 100%);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      background: var(--arc-grad);
    }

    /* Arc signature bottom sheets */
    .sheet-transition {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }
    .sheet-hidden {
      transform: translateY(105%);
    }
    .sheet-visible {
      transform: translateY(0%);
    }

    /* Content scaling when sheet or tabs open */
    .view-scaled {
      transform: scale(0.92) translateY(-16px);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    /* Hide scrollbars */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

    let currentZoom = 100;

    // DOM Elements

    const browserContainer = document.getElementById('browser-container');

    const searchInput = document.getElementById('search-input');
    const menuDomainLabel = document.getElementById('menu-domain-label');
    const zoomLabel = document.getElementById('zoom-label');
    const desktopCheckbox = document.getElementById('desktop-checkbox');
    const tabsTrack = document.getElementById('tabs-track');

    // Startup logic: If starting with blank or first launch, pop open the search sheet directly!
    window.addEventListener('DOMContentLoaded', () => {
      // Default initial website (Wikipedia works cleanly in mobile frames)
      navigateTo('wikipedia.org');
      // Initially pop the Search Sheet so users don't see a dead screen!
      openSearchSheet();
    });

    // Close all sheets/overlays
    function closeAllOverlays() {
      searchSheet.classList.remove('sheet-visible');
      searchSheet.classList.add('sheet-hidden');

      menuSheet.classList.remove('sheet-visible');
      menuSheet.classList.add('sheet-hidden');

      tabsOverlay.classList.remove('opacity-100', 'pointer-events-auto');
      tabsOverlay.classList.add('opacity-0', 'pointer-events-none');

      backdrop.classList.remove('opacity-100', 'pointer-events-auto');
      backdrop.classList.add('opacity-0', 'pointer-events-none');

      browserContainer.classList.remove('view-scaled');
      dockBar.style.transform = 'translateY(0)';
      
      activeSheet = null;
      searchInput.blur();
    }

    // Open Search Sheet (Arc Home)
    function openSearchSheet() {
      closeAllOverlays();
      searchSheet.classList.remove('sheet-hidden');
      searchSheet.classList.add('sheet-visible');

      backdrop.classList.remove('opacity-0', 'pointer-events-none');
      backdrop.classList.add('opacity-100', 'pointer-events-auto');

      browserContainer.classList.add('view-scaled');
      dockBar.style.transform = 'translateY(160%)';

      activeSheet = searchSheet;
      setTimeout(() => searchInput.focus(), 250);
    }

    // Open Page Menu Sheet
    function openMenuSheet() {
      closeAllOverlays();
      menuSheet.classList.remove('sheet-hidden');
      menuSheet.classList.add('sheet-visible');

      backdrop.classList.remove('opacity-0', 'pointer-events-none');
      backdrop.classList.add('opacity-100', 'pointer-events-auto');

      browserContainer.classList.add('view-scaled');
      dockBar.style.transform = 'translateY(160%)';

      activeSheet = menuSheet;
    }

    // Open Tab Switcher (Carousel)
    function openTabsOverlay() {
      closeAllOverlays();
      renderTabs();
      tabsOverlay.classList.remove('opacity-0', 'pointer-events-none');
      tabsOverlay.classList.add('opacity-100', 'pointer-events-auto');
      browserContainer.classList.add('view-scaled');
      dockBar.style.transform = 'translateY(160%)';
    }

    // Render Tab Cards
    function renderTabs() {
      tabsTrack.innerHTML = '';
      tabs.forEach((tab) => {
        const card = document.createElement('div');
        card.className = "flex-none w-[70vw] max-w-[280px] h-[55vh] bg-white rounded-[24px] shadow-2xl flex flex-col overflow-hidden snap-center border border-white/60 active:scale-95 transition-transform";
        card.innerHTML = `
          <div class="p-4 flex items-center justify-between border-b border-gray-100">
            <span class="font-semibold text-sm truncate text-gray-800">${tab.domain}</span>
            <button onclick="event.stopPropagation(); closeTab('${tab.id}')" class="text-gray-400 p-1">✕</button>
          </div>
          <div class="flex-1 bg-gray-50 flex items-center justify-center p-4">
            <span class="text-xs text-gray-400 font-mono">${tab.title}</span>
          </div>
        `;
        card.onclick = () => {
          activeTabId = tab.id;
          browserFrame.src = tab.url;
          menuDomainLabel.innerText = tab.domain;
          closeAllOverlays();
        };
        tabsTrack.appendChild(card);
      });
    }

    function closeTab(id) {
      tabs = tabs.filter(t => t.id !== id);
      if (tabs.length === 0) {
        tabs.push({ id: '1', title: 'New Tab', url: 'https://en.m.wikipedia.org', domain: 'wikipedia.org' });
      }
      renderTabs();
    }

    // Navigation and URL parsing
    function navigateTo(target) {
      let finalUrl = target.trim();
      if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
        if (finalUrl.includes('.') && !finalUrl.includes(' ')) {
          finalUrl = 'https://' + finalUrl;
        } else {
          finalUrl = 'https://lite.duckduckgo.com/lite/?q=' + encodeURIComponent(finalUrl);
        }
      }

      browserFrame.src = finalUrl;
      try {
        const d = new URL(finalUrl).hostname.replace('www.', '');
        menuDomainLabel.innerText = d;
      } catch (e) {
        menuDomainLabel.innerText = finalUrl;
      }

      closeAllOverlays();
    }

    function searchQuery(query) {
      navigateTo('https://lite.duckduckgo.com/lite/?q=' + encodeURIComponent(query));
    }

    function handleSearch(e) {
      e.preventDefault();
      const val = searchInput.value.trim();
      if (val) {
        navigateTo(val);
        searchInput.value = '';
      }
    }

    // Page controls
    function historyBack() {
      try { browserFrame.contentWindow.history.back(); } catch (e) {}
    }

    function historyForward() {
      try { browserFrame.contentWindow.history.forward(); } catch (e) {}
    }

    function reloadPage() {
      browserFrame.src = browserFrame.src;
      closeAllOverlays();
    }

    function copyCurrentUrl() {
      navigator.clipboard.writeText(browserFrame.src);
      alert('Link copied to clipboard!');
      closeAllOverlays();
    }

    function sharePage() {
      if (navigator.share) {
        navigator.share({ title: menuDomainLabel.innerText, url: browserFrame.src }).catch(() => {});
      } else {
        copyCurrentUrl();
      }
    }

    function changeZoom(delta) {
      currentZoom = Math.min(180, Math.max(60, currentZoom + delta));
      zoomLabel.innerText = currentZoom + '%';
      browserFrame.style.zoom = (currentZoom / 100);
    }

    function toggleDesktopMode() {
      isDesktopMode = !isDesktopMode;
      desktopCheckbox.innerHTML = isDesktopMode ? '✓' : '';
      if (isDesktopMode) {
        browserFrame.style.width = '1280px';
        browserFrame.style.transform = `scale(${window.innerWidth / 1280})`;
        browserFrame.style.transformOrigin = '0 0';
      } else {
        browserFrame.style.width = '100%';
        browserFrame.style.transform = 'none';
      }
    }
  </script>
</body>
</html>
